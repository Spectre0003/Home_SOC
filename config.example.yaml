# =============================================
# HOME SOC CONFIGURATION
# =============================================
#
# Copy this file to config.yaml and edit as needed:
#
#     cp config.example.yaml config.yaml
#
# config.yaml is gitignored. This example file is committed, so the
# schema stays visible in the repository without exposing host details.
#
# Every key is optional — anything you omit falls back to the defaults
# in homesoc/common/config.py. A config containing only the two or
# three values you actually want to change is valid.
# =============================================


# ---------------------------------------------
# PATHS
# ---------------------------------------------
# {home} and {logs} may be referenced by other path entries.
# ~ is expanded. Relative paths resolve against the working directory.

paths:
  home: ~/homesoc
  logs: "{home}/logs"
  dashboard: "{home}/dashboard.html"


# ---------------------------------------------
# COLLECTION
# ---------------------------------------------

collection:

  linux:
    auth_log: /var/log/auth.log
    collect_journal: true

  windows:
    # The SOC server pulls from this endpoint over WinRM (ADR 0002).
    # Leave null to disable Windows collection entirely -- homesoc
    # collect then only touches Linux logs, and nothing else in the
    # pipeline complains about the absence.
    host: null

    # A dedicated, low-privilege account -- member of "Event Log
    # Readers" and "Remote Management Users" on the endpoint, nothing
    # more. See README.md "Windows Collection Setup".
    username: null

    # Never required here. HOMESOC_WINRM_PASSWORD is checked first and
    # should be how this is actually set; this key exists purely as a
    # documented fallback for a lab where that trade-off is acceptable.
    password: null

    winrm_port: 5985
    use_ssl: false

    # pypsrp auth mechanism. "ntlm" is the practical default for a
    # workgroup lab with no domain -- kerberos needs one, "basic" sends
    # credentials with essentially no protection, "credssp" needs
    # CredSSP enabled on the endpoint for no benefit here.
    auth: ntlm

    timeout_seconds: 30

    event_ids: [4624, 4625, 4672]

    # Applied both as the bootstrap window (the most recent N events,
    # on a first-ever collection) and as a per-call safety cap on every
    # incremental pull afterward, so one collection can never try to
    # drag in an unbounded backlog after a long gap.
    max_events: 500


# ---------------------------------------------
# DETECTION THRESHOLDS
# ---------------------------------------------
# These replace the hardcoded 5 / 5 / 5 / 3 in the v1.0 analyzers.
# They become per-rule settings in Stage 4; until then they are global.

detection:

  linux:
    failed_login_threshold: 5
    bruteforce_per_ip_threshold: 5

  windows:
    failed_login_threshold: 5
    failed_per_account_threshold: 3


# ---------------------------------------------
# CORRELATION
# ---------------------------------------------

correlation:
  window_minutes: 5
  min_failures: 3


# ---------------------------------------------
# RESPONSE
# ---------------------------------------------
# Which incident severities produce a simulated response action.
# Widen to [CRITICAL, HIGH] to include uncorrelated brute force.
# All actions remain log-only; nothing is enforced.

response:
  severities: [CRITICAL]
  action_type: block_ip


# ---------------------------------------------
# REPORTING
# ---------------------------------------------

reporting:
  recent_limit: 10


# ---------------------------------------------
# LOGGING
# ---------------------------------------------

logging:
  level: INFO
  to_file: true
  filename: homesoc.log
